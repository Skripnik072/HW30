name: Django CI/CD

on:
  push:
    branches: [ main, master, homework30, develop ]
  pull_request:
    branches: [ main, master, homework30 ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.0
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-ansi --no-root

      - name: Run migrations
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          NAME: testdb
          USER: testuser
          PASSWORD: testpass
          HOST: localhost
          PORT: "5432"
          STRIPE_API_KEY: test-stripe-key
          CELERY_BROKER_URL: redis://localhost:6379
          CELERY_RESULT_BACKEND: redis://localhost:6379
        run: |
          poetry run python manage.py migrate

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          NAME: testdb
          USER: testuser
          PASSWORD: testpass
          HOST: localhost
          PORT: "5432"
          DJANGO_SETTINGS_MODULE: config.settings
          STRIPE_API_KEY: test-stripe-key
          CELERY_BROKER_URL: redis://localhost:6379
          CELERY_RESULT_BACKEND: redis://localhost:6379
        run: |
          poetry run python manage.py test
 
 

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/homework30'

    steps:
      - uses: actions/checkout@v4
      - name: Fetch updates
        run: |
          cd ${{ secrets.DEPLOY_DIR }}
          git fetch
          git switch dev
          git merge origin/dev
          docker compose up --build --force-recreate -d
