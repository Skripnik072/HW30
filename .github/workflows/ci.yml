name: Django CI/CD




on:
  push:
    branches: [ main, master, homework30, develop ]
  pull_request:
    branches: [ main, master, homework30 ]




jobs:
  test:
    runs-on: ubuntu-latest




    services:
      postgres:
        image: postgres:16.0
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432




      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379




    steps:
      - name: Check out code
        uses: actions/checkout@v3




      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'




      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
 
 
 

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
 
 
 

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-ansi --no-root
 
 
 

      - name: Run migrations
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          NAME: testdb
          USER: testuser
          PASSWORD: testpass
          HOST: localhost
          PORT: "5432"
          STRIPE_API_KEY: test-stripe-key
          CELERY_BROKER_URL: redis://localhost:6379
          CELERY_RESULT_BACKEND: redis://localhost:6379
        run: |
          poetry run python manage.py migrate
 
 
 

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          NAME: testdb
          USER: testuser
          PASSWORD: testpass
          HOST: localhost
          PORT: "5432"
          DJANGO_SETTINGS_MODULE: config.settings
          STRIPE_API_KEY: test-stripe-key
          CELERY_BROKER_URL: redis://localhost:6379
          CELERY_RESULT_BACKEND: redis://localhost:6379
        run: |
          poetry run python manage.py test
 
 
 

  deploy:
    runs-on: ubuntu-latest
    needs: test
    # Добавил homework30 в условие
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/homework30'




    steps:
      - name: Check out code
        uses: actions/checkout@v3




      - name: Debug branch info
        run: |
          echo "Current branch: ${{ github.ref }}"
          echo "Event name: ${{ github.event_name }}"
 
 
 

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}




      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
 
 
 

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "echo 'SSH connection successful'"
 
 
 

      - name: Copy project files to server
        run: |
          rsync -avz \
            --exclude '__pycache__' \
            --exclude '.git' \
            --exclude 'venv' \
            --exclude '.venv' \
            --exclude '*.pyc' \
            . ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_DIR }}
 
 
 
 
 
 
 

      - name: Deploy with Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd ${{ secrets.DEPLOY_DIR }}
 
            # Проверяем наличие Docker
            if ! command -v docker &> /dev/null 2>&1; then
              echo "Error: Docker is not installed. Please install Docker first."
              exit 1
            fi
 
            # Определяем команду docker-compose (новый или старый синтаксис)
            # Сначала пробуем новый синтаксис docker compose (Docker Compose V2)
            if docker compose version &> /dev/null 2>&1; then
              DOCKER_COMPOSE="docker compose"
              echo "Using Docker Compose V2 (docker compose)"
            # Затем пробуем старый синтаксис docker-compose (V1)
            elif command -v docker-compose &> /dev/null 2>&1; then
              DOCKER_COMPOSE="docker-compose"
              echo "Using Docker Compose V1 (docker-compose)"
            # Если ничего не найдено, пытаемся установить docker-compose V1
            else
              echo "Docker Compose not found, attempting to install..."
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              if command -v docker-compose &> /dev/null 2>&1; then
                DOCKER_COMPOSE="docker-compose"
                echo "Docker Compose V1 installed successfully"
              else
                echo "Error: Failed to install docker-compose. Please install Docker Compose manually."
                exit 1
              fi
            fi
 
            # Останавливаем и удаляем старые контейнеры
            $DOCKER_COMPOSE down || true
 
            # Собираем образы
            $DOCKER_COMPOSE build
 
            # Запускаем только базу данных и redis
            $DOCKER_COMPOSE up -d db redis
 
            # Ждем пока база данных будет готова
            echo "Waiting for database to be ready..."
            sleep 10
 
            # Выполняем миграции внутри контейнера web (который еще не запущен, но образ уже собран)
            $DOCKER_COMPOSE run --rm web python manage.py migrate
 
            # Запускаем все остальные контейнеры
            $DOCKER_COMPOSE up -d
 
            # Ждем пока контейнеры запустятся
            echo "Waiting for containers to start..."
            sleep 5
 
            # Выполняем collectstatic внутри контейнера
            $DOCKER_COMPOSE exec -T web python manage.py collectstatic --noinput || echo "Collectstatic completed with warnings"
          EOF
 
 
 
 
 
 
 
 
 
 
 

      - name: Deploy success
        run: |
          echo "✅ Deployment completed successfully to branch: ${{ github.ref }}"