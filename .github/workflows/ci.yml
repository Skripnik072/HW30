name: Django CI/CD

on:
  push:
    branches: [ main, master, homework30, develop ]
  pull_request:
    branches: [ main, master, homework30 ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.0
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install flake8
        run: |
          poetry add --dev flake8

      - name: Run flake8
        run: poetry run flake8 .

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-ansi --no-root

      - name: Run migrations
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          NAME: testdb
          USER: testuser
          PASSWORD: testpass
          HOST: localhost
          PORT: "5432"
          STRIPE_API_KEY: test-stripe-key
          CELERY_BROKER_URL: redis://localhost:6379
          CELERY_RESULT_BACKEND: redis://localhost:6379
        run: |
          poetry run python manage.py migrate

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          NAME: testdb
          USER: testuser
          PASSWORD: testpass
          HOST: localhost
          PORT: "5432"
          DJANGO_SETTINGS_MODULE: config.settings
          STRIPE_API_KEY: test-stripe-key
          CELERY_BROKER_URL: redis://localhost:6379
          CELERY_RESULT_BACKEND: redis://localhost:6379
        run: |
          poetry run python manage.py test
 
 

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/homework30' || github.ref == 'refs/heads/develop'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Debug SSH setup
        run: |
          echo "Checking SSH agent..."
          ssh-add -l || echo "No keys in agent"
          echo "SSH_AUTH_SOCK: $SSH_AUTH_SOCK"
          echo "Testing SSH connection..."
          ssh -v -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "echo 'SSH connection successful'" || true

      - name: Fetch updates and deploy
        run: |
          ssh -v -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd /home/viktor65_ds
 
            # Обновляем код из git
            echo "Fetching updates from git..."
            git fetch
            git switch develop
            git merge origin/develop
 
            # Запускаем контейнеры (сначала db и redis, потом web)
            echo "Starting Docker containers..."
            docker compose up -d --build db redis
 
            # Ждем пока контейнер db будет запущен
            echo "Waiting for db container to start..."
            for i in {1..30}; do
              if docker compose ps db | grep -q "Up"; then
                echo "DB container is running!"
                break
              fi
              echo "Waiting for db container... ($i/30)"
              sleep 2
            done
 
            # Ждем пока база данных будет готова к подключениям
            echo "Waiting for database to be ready..."
            for i in {1..60}; do
              if docker compose exec -T db pg_isready > /dev/null 2>&1; then
                echo "Database is ready for connections!"
                sleep 3
                break
              fi
              echo "Waiting for database... ($i/60)"
              sleep 2
            done
 
            # Запускаем web контейнер
            echo "Starting web container..."
            docker compose up -d --build web
 
            # Ждем пока контейнер web будет готов
            echo "Waiting for web container to be ready..."
            for i in {1..30}; do
              if docker compose ps web | grep -q "Up"; then
                echo "Web container is ready!"
                sleep 3
                break
              fi
              echo "Waiting for web container... ($i/30)"
              sleep 2
            done
 
            # Выполняем миграции внутри Docker контейнера
            echo "Running migrations in Docker container..."
            docker compose exec -T web python manage.py migrate
 
            # Собираем статические файлы
            echo "Collecting static files..."
            docker compose exec -T web python manage.py collectstatic --noinput
          EOF

      - name: Deploy success
        run: |
          echo "✅ Deployment completed successfully to branch: ${{ github.ref }}"
