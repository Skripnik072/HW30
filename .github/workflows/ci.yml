name: Django CI/CD


on:
  push:
    branches: [ main, master, homework30, develop ]
  pull_request:
    branches: [ main, master, homework30 ]


jobs:
  test:
    runs-on: ubuntu-latest


    services:
      postgres:
        image: postgres:16.0
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432


      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379


    steps:
      - name: Check out code
        uses: actions/checkout@v3


      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'


      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "$HOME/.local/bin" >> $GITHUB_PATH


      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client


      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-ansi --no-root


      - name: Run migrations
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          NAME: testdb
          USER: testuser
          PASSWORD: testpass
          HOST: localhost
          PORT: "5432"
          STRIPE_API_KEY: test-stripe-key
          CELERY_BROKER_URL: redis://localhost:6379
          CELERY_RESULT_BACKEND: redis://localhost:6379
        run: |
          poetry run python manage.py migrate


      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          NAME: testdb
          USER: testuser
          PASSWORD: testpass
          HOST: localhost
          PORT: "5432"
          DJANGO_SETTINGS_MODULE: config.settings
          STRIPE_API_KEY: test-stripe-key
          CELERY_BROKER_URL: redis://localhost:6379
          CELERY_RESULT_BACKEND: redis://localhost:6379
        run: |
          poetry run python manage.py test


  deploy:
    runs-on: ubuntu-latest
    needs: test
    # Добавил homework30 в условие
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/homework30'


    steps:
      - name: Check out code
        uses: actions/checkout@v3


      - name: Debug branch info
        run: |
          echo "Current branch: ${{ github.ref }}"
          echo "Event name: ${{ github.event_name }}"


      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}


      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync


      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "echo 'SSH connection successful'"


      - name: Copy project files to server
        run: |
          rsync -avz \
            --exclude '__pycache__' \
            --exclude '.git' \
            --exclude 'venv' \
            --exclude '.venv' \
            --exclude '*.pyc' \
            --exclude '.env' \
            . ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_DIR }}


      - name: Install dependencies on server
        run: |
          ssh -o StrictHostKeyChecking=no -t ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd ${{ secrets.DEPLOY_DIR }}
            
            # Проверяем наличие Python 3.13
            if ! command -v python3.13 &> /dev/null; then
              echo "Python 3.13 not found, installing..."
              sudo apt-get update
              sudo apt-get install -y software-properties-common
              sudo add-apt-repository -y ppa:deadsnakes/ppa
              sudo apt-get update
              sudo apt-get install -y python3.13 python3.13-venv python3.13-dev
            fi
            
            # Создаем виртуальное окружение с Python 3.13
            python -m venv venv --clear
            source venv/bin/activate
            
            # Проверяем версию Python в venv
            python --version
            
            # Обновляем pip
            C:\Users\it-pc.ru\AppData\Local\Programs\Python\Python313\python.exe -m pip install --upgrade pip
            
            # Устанавливаем poetry
            pip install poetry
            
            # Устанавливаем зависимости проекта
            poetry install --no-interaction --no-ansi --no-root
          EOF


      - name: Apply migrations on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd ${{ secrets.DEPLOY_DIR }}
            source venv/bin/activate
            python manage.py migrate
          EOF


      - name: Collect static files on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd ${{ secrets.DEPLOY_DIR }}
            source venv/bin/activate
            python manage.py collectstatic --noinput
          EOF


      - name: Restart application
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            sudo systemctl restart myapp.service || echo "Service might not exist, continuing..."
          EOF


      - name: Deploy success
        run: |
          echo "✅ Deployment completed successfully to branch: ${{ github.ref }}"