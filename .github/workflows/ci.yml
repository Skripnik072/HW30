name: Django CI/CD

on:
  push:
    branches: [ main, master, homework30, develop ]
  pull_request:
    branches: [ main, master, homework30 ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.0
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-ansi --no-root

      - name: Run migrations
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          NAME: testdb
          USER: testuser
          PASSWORD: testpass
          HOST: localhost
          PORT: "5432"
          STRIPE_API_KEY: test-stripe-key
          CELERY_BROKER_URL: redis://localhost:6379
          CELERY_RESULT_BACKEND: redis://localhost:6379
        run: |
          poetry run python manage.py migrate

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          NAME: testdb
          USER: testuser
          PASSWORD: testpass
          HOST: localhost
          PORT: "5432"
          DJANGO_SETTINGS_MODULE: config.settings
          STRIPE_API_KEY: test-stripe-key
          CELERY_BROKER_URL: redis://localhost:6379
          CELERY_RESULT_BACKEND: redis://localhost:6379
        run: |
          poetry run python manage.py test
 
 

  deploy:
    runs-on: ubuntu-latest
    needs: test
    # Добавил homework30 в условие
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/homework30'

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Debug branch info
        run: |
          echo "Current branch: ${{ github.ref }}"
          echo "Event name: ${{ github.event_name }}"

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "echo 'SSH connection successful'"

      - name: Copy project files to server
        run: |
          rsync -avz \
            --exclude '__pycache__' \
            --exclude '.git' \
            --exclude 'venv' \
            --exclude '.venv' \
            --exclude '*.pyc' \
            --exclude '.env' \
            . ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_DIR }}

      - name: Install Docker and Docker Compose on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
 
            # Проверяем наличие Docker
            if ! command -v docker &> /dev/null; then
              echo "Docker is not installed. Installing Docker..."
 
              # Обновляем пакеты
              sudo apt-get update
 
              # Устанавливаем необходимые пакеты
              sudo apt-get install -y \
                ca-certificates \
                curl \
                gnupg \
                lsb-release
 
              # Добавляем официальный GPG ключ Docker
              sudo mkdir -p /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
 
              # Настраиваем репозиторий Docker
              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
                $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
 
              # Устанавливаем Docker
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
 
              # Добавляем пользователя в группу docker (чтобы не использовать sudo)
              sudo usermod -aG docker $USER
 
              echo "Docker installed successfully"
            else
              echo "Docker is already installed"
              docker --version
            fi
 
            # Проверяем наличие Docker Compose
            if ! command -v docker compose &> /dev/null; then
              echo "Docker Compose plugin is not installed. Installing..."
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            else
              echo "Docker Compose is already installed"
              docker compose version
            fi
          EOF

      - name: Deploy with Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd ${{ secrets.DEPLOY_DIR }}
 
            # Проверяем наличие Docker
            if ! command -v docker &> /dev/null; then
              echo "Error: Docker is not installed. Please install Docker first."
              exit 1
            fi
 
            # Проверяем наличие Docker Compose
            if ! command -v docker compose &> /dev/null; then
              echo "Error: Docker Compose is not installed. Please install Docker Compose first."
              exit 1
            fi
 
            # Останавливаем и удаляем старые контейнеры
            docker compose down || true
 
            # Временно изменяем команду запуска web контейнера, чтобы не выполнять миграции при старте
            # Создаем временный docker-compose файл для запуска без миграций
            cp docker-compose.yml docker-compose.yml.backup
            # Используем sed для изменения команды запуска
            sed -i 's/python manage.py migrate &&/python manage.py runserver/' docker-compose.yml || \
            sed -i 's|bash -c "python manage.py migrate &&|bash -c "python manage.py runserver|' docker-compose.yml || \
            python3 -c "import re; content = open('docker-compose.yml').read(); open('docker-compose.yml', 'w').write(re.sub(r'bash -c \"python manage\.py migrate &&\s+python manage\.py runserver', 'bash -c \"python manage.py runserver', content))"
            echo "Modified docker-compose.yml to skip migrations on startup"
 
            # Собираем и запускаем контейнеры (без миграций в команде запуска)
            docker compose up -d --build
 
            # Ждем пока база данных будет готова
            echo "Waiting for database to be ready..."
            for i in {1..30}; do
              if docker compose exec -T db pg_isready > /dev/null 2>&1; then
                echo "Database is ready!"
                break
              fi
              echo "Waiting for database... ($i/30)"
              sleep 2
            done
 
            # Ждем пока контейнер web будет запущен
            echo "Waiting for web container to be ready..."
            for i in {1..30}; do
              if docker compose ps web | grep -q "Up"; then
                echo "Web container is ready!"
                break
              fi
              echo "Waiting for web container... ($i/30)"
              sleep 2
            done
 
            # Показываем статус контейнеров
            docker compose ps
          EOF

      - name: Install dependencies on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd ${{ secrets.DEPLOY_DIR }}
 
            # Проверяем наличие Python 3.13
            if ! command -v python3.13 &> /dev/null; then
              echo "Python 3.13 not found, installing..."
              sudo apt-get update
              sudo apt-get install -y software-properties-common
              sudo add-apt-repository -y ppa:deadsnakes/ppa
              sudo apt-get update
              sudo apt-get install -y python3.13 python3.13-venv python3.13-dev python3.13-distutils python3.13-ensurepip
            else
              # Убеждаемся, что все необходимые пакеты установлены
              sudo apt-get update
              sudo apt-get install -y python3.13-venv python3.13-dev python3.13-distutils python3.13-ensurepip || true
            fi
 
            # Создаем виртуальное окружение с Python 3.13
            # Пробуем создать venv с pip, если не получается - используем --without-pip
            set +e
            python3.13 -m venv venv --clear
            VENV_EXIT_CODE=$?
            set -e
 
            if [ $VENV_EXIT_CODE -ne 0 ]; then
              echo "Standard venv creation failed, creating venv without pip..."
              python3.13 -m venv venv --clear --without-pip
              source venv/bin/activate
              # Устанавливаем pip вручную
              curl -sS https://bootstrap.pypa.io/get-pip.py | python
            else
              source venv/bin/activate
            fi
 
            # Проверяем версию Python в venv
            python --version
 
            # Обновляем pip
            python -m pip install --upgrade pip
 
            # Устанавливаем poetry
            pip install poetry
 
            # Устанавливаем зависимости проекта
            poetry install --no-interaction --no-ansi --no-root
          EOF

      - name: Apply migrations on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd ${{ secrets.DEPLOY_DIR }}
 
            # Дополнительное ожидание и проверка готовности БД
            echo "Waiting for database to be fully ready..."
            for i in {1..20}; do
              if docker compose exec -T db pg_isready > /dev/null 2>&1; then
                echo "Database is ready for connections!"
                # Дополнительная пауза для полной готовности PostgreSQL
                sleep 3
                break
              fi
              echo "Waiting for database... ($i/20)"
              sleep 2
            done
 
            # Выполняем миграции внутри уже запущенного Docker контейнера
            # docker compose exec использует тот же контейнер, который уже в правильной сети
            echo "Running migrations in Docker container..."
            docker compose exec -T web python manage.py migrate
          EOF

      - name: Collect static files on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd ${{ secrets.DEPLOY_DIR }}
 
            # Выполняем collectstatic внутри уже запущенного Docker контейнера
            # docker compose exec использует тот же контейнер, который уже в правильной сети
            echo "Collecting static files in Docker container..."
            docker compose exec -T web python manage.py collectstatic --noinput
          EOF

      - name: Restore docker-compose and restart web
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd ${{ secrets.DEPLOY_DIR }}
 
            # Восстанавливаем оригинальный docker-compose.yml
            if [ -f docker-compose.yml.backup ]; then
              mv docker-compose.yml.backup docker-compose.yml
              echo "Restored original docker-compose.yml"
 
              # Перезапускаем web контейнер с правильной командой (с миграциями)
              echo "Restarting web container with migrations..."
              docker compose up -d --no-deps web
            fi
          EOF

      - name: Restart application
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            sudo systemctl restart myapp.service || echo "Service might not exist, continuing..."
          EOF

      - name: Deploy success
        run: |
          echo "✅ Deployment completed successfully to branch: ${{ github.ref }}"
