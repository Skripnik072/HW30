name: Django CI/CD

on:
  push:
    branches: [ main, master, homework30 ]
  pull_request:
    branches: [ main, master, homework30 ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.0
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-ansi

      - name: Run migrations
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          NAME: testdb
          USER: testuser
          PASSWORD: testpass
          HOST: localhost
          PORT: "5432"
          STRIPE_API_KEY: test-stripe-key
          CELERY_BROKER_URL: redis://localhost:6379
          CELERY_RESULT_BACKEND: redis://localhost:6379
        run: |
          poetry run python manage.py migrate

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          NAME: testdb
          USER: testuser
          PASSWORD: testpass
          HOST: localhost
          PORT: "5432"
          STRIPE_API_KEY: test-stripe-key
          CELERY_BROKER_URL: redis://localhost:6379
          CELERY_RESULT_BACKEND: redis://localhost:6379
        run: |
          poetry run python manage.py test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/homework30'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Debug info
        run: |
          echo "Branch: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
          echo "SSH User: ${{ secrets.SSH_USER }}"
          echo "Server IP: ${{ secrets.SERVER_IP }}"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connection with verbose output
        run: |
          ssh -vvv -o StrictHostKeyChecking=no -o ConnectTimeout=30 ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "echo '✅ SSH connection successful'"

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Deploy files
        run: |
          rsync -avz \
            --exclude '__pycache__' \
            --exclude '.git' \
            --exclude 'venv' \
            --exclude '.venv' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude 'db.sqlite3' \
            --exclude 'coverage_report' \
            . ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_DIR }}

      - name: Setup server environment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd ${{ secrets.DEPLOY_DIR }}
            
            # Create venv if not exists
            python3 -m venv venv --clear
            
            # Activate and install dependencies
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt 2>/dev/null || pip install poetry
            poetry install --no-dev --no-interaction
            
            # Django setup
            python manage.py migrate
            python manage.py collectstatic --noinput
            
            echo "✅ Server setup completed"
          EOF

      - name: Restart services
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            # Try to restart common service names
            sudo systemctl restart nginx 2>/dev/null || echo "nginx not found"
            sudo systemctl restart gunicorn 2>/dev/null || echo "gunicorn not found"
            sudo systemctl restart myapp 2>/dev/null || echo "myapp not found"
            sudo systemctl restart celery 2>/dev/null || echo "celery not found"
            
            echo "✅ Services restarted"
          EOF
